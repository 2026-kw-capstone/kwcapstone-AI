[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 출력 설정
addopts =
    -v
    --tb=short
    --no-header

# 마커 등록
markers =
    slow: 실행 시간이 긴 테스트 (Whisper 모델 로딩 등)
    real_openai: 실제 OpenAI API 호출 (TEST_USE_REAL_OPENAI=1 필요)
    real_whisper: 실제 Whisper STT 실행 (TEST_USE_REAL_WHISPER=1 필요)
